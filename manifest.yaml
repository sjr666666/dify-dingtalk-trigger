description:
  en_US: DingTalk (钉钉) is a workplace communication and collaboration platform by Alibaba. This plugin subscribes to DingTalk Open Platform events so Dify workflows can react to approval changes and organization updates.
  ja_JP: DingTalk（钉钉）はAlibabaが提供するビジネスコミュニケーションプラットフォームです。このプラグインはDingTalkオープンプラットフォームのイベントを購読し、Difyワークフローが承認の変更や組織の更新に反応できるようにします。
  zh_Hans: 钉钉是阿里巴巴出品的企业通讯与协同平台。本插件订阅钉钉开放平台的事件，让 Dify 工作流能够响应审批状态变更与组织人员变动。
