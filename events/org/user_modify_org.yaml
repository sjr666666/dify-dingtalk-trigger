identity:
  name: user_modify_org
  author: sjr666666
  label:
    en_US: User Profile Updated
    zh_Hans: 员工信息变更
    ja_JP: ユーザー情報更新

description:
  en_US: This event activates when one or more user profiles in the DingTalk organization are updated.
  zh_Hans: 当钉钉组织内的用户资料发生变更时激活。
  ja_JP: DingTalk組織内のユーザー情報が更新されたときにアクティブになります。

parameters: []

output_schema:
  type: object
  properties:
    user_ids:
      type: array
      items:
        type: string
      description: User ids of the updated users

    corp_id:
      type: string
      description: Corporation id

    timestamp:
      type: string
      description: Event timestamp (milliseconds since epoch, as sent by DingTalk)

extra:
  python:
    source: events/org/user_modify_org.py
